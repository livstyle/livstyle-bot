schema_version = 1
chip = "esp32c3"
display_name = "ESP32-C3"
arch = "riscv"
hp_cores = 1
support_tier = "verified"

[idf]
min_version = "4.3"

[usb]
usb_serial_jtag = true
native_ids = [[0x303A, 0x1001]]

[debug]
openocd_target = "target/esp32c3.cfg"
openocd_interface = "interface/esp_usb_jtag.cfg"
gdb = "riscv32-esp-elf-gdb"

[radio]
wifi = { standard = "wifi4", bands = ["2.4ghz"] }
ble = true

[boot]
log_patterns = ["main_task: Calling app_main()"]

[provenance]
status = "draft"
sources = ["EspSmith src-tauri/src/commands/openocd.rs", "EspSmith src-tauri/src/commands/gdb_session.rs"]
